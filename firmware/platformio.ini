; PlatformIO Project Configuration File
;
; ESP32-S3 firmware for the lumehead 16x8 LED matrix toolhead display.
;
; Two roles share the same source tree, selected by build flag:
;
;   master  - faces the host over I2C @ 0x42 (Wire), renders the 16x8 frame,
;             drives its own 8x8 panel, and pushes the right half to the
;             slave over a second I2C bus (Wire1, master mode @ 400 kHz).
;
;   slave   - tiny pixel sink. Listens on I2C @ 0x43 (Wire), receives raw
;             RGB frames, blits them to its own 8x8 panel.
;
; Flash the host-facing board with env:master and the secondary panel board
; with env:slave.

[platformio]
default_envs = master

[env]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
; ESP32-S3-Matrix has 4 MB flash; default board JSON declares 8 MB.
board_upload.flash_size = 4MB
board_build.partitions  = default.csv
board_build.flash_size  = 4MB
lib_deps =
    fastled/FastLED@^3.6.0
    Wire

[env:master]
extends = env
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLUMEHEAD_ROLE_MASTER=1

[env:slave]
extends = env
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLUMEHEAD_ROLE_SLAVE=1
