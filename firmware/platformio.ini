; PlatformIO Project Configuration File
;
; ESP32-S3 firmware for the lumehead 16x8 LED matrix toolhead display.
; Receives commands over I2C (slave @ 0x42) from a host (Klipper MCU /
; Raspberry Pi) and renders to two chained WS2812 8x8 panels via FastLED.

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    fastled/FastLED@^3.6.0
    Wire
