; PlatformIO Project Configuration File
;
; ESP32-S3 firmware for the lumehead 16x8 LED matrix toolhead display.
;
; Environment naming convention:
;   <hardware>-master              host-facing board
;   <hardware>-slave-<id>          pixel-sink board, id starts at 0
;
; Adding a new board:
;   1. Add a `[hw_<key>]` section with board / flash / pin settings.
;   2. Add `[env:<key>-master]` and one or more `[env:<key>-slave-<id>]`.
;   3. Add the matching entry in hardware.json so CI builds it on release.

[platformio]
default_envs = waveshare-esp32-s3-matrix-master

[env]
platform      = espressif32
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps =
    fastled/FastLED@^3.6.0
    Wire

; ---------------------------------------------------------------------------
; Hardware: Waveshare ESP32-S3-Matrix
;   - 4 MB QIO flash
;   - Onboard 8x8 WS2812 panel hard-wired to GPIO 14
;   - Free GPIOs used: 4, 5, 8, 9
; ---------------------------------------------------------------------------
[hw_waveshare_esp32_s3_matrix]
board                   = esp32-s3-devkitc-1
; Default board JSON declares 8 MB; this board actually has 4 MB.
board_upload.flash_size = 4MB
board_build.partitions  = default.csv
board_build.flash_size  = 4MB
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLUMEHEAD_HW_WAVESHARE_ESP32_S3_MATRIX=1
    -DLUMEHEAD_LED_DATA_PIN=14
    -DLUMEHEAD_HOST_I2C_SDA=6
    -DLUMEHEAD_HOST_I2C_SCL=7
    -DLUMEHEAD_INTER_I2C_SDA=4
    -DLUMEHEAD_INTER_I2C_SCL=5

; ---------------------------------------------------------------------------
; Concrete envs for the Waveshare board
; ---------------------------------------------------------------------------
[env:waveshare-esp32-s3-matrix-master]
extends     = env, hw_waveshare_esp32_s3_matrix
build_flags =
    ${hw_waveshare_esp32_s3_matrix.build_flags}
    -DLUMEHEAD_ROLE_MASTER=1

[env:waveshare-esp32-s3-matrix-slave-0]
extends     = env, hw_waveshare_esp32_s3_matrix
build_flags =
    ${hw_waveshare_esp32_s3_matrix.build_flags}
    -DLUMEHEAD_ROLE_SLAVE=1
    -DLUMEHEAD_SLAVE_ID=0

[env:waveshare-esp32-s3-matrix-slave-1]
extends     = env, hw_waveshare_esp32_s3_matrix
build_flags =
    ${hw_waveshare_esp32_s3_matrix.build_flags}
    -DLUMEHEAD_ROLE_SLAVE=1
    -DLUMEHEAD_SLAVE_ID=1
