name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach artifacts to (workflow_dispatch only)"
        required: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Discover (hardware, role) pairs from firmware/hardware.json so adding new
  # boards is a one-file change with no workflow edits.
  # ---------------------------------------------------------------------------
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          with open("firmware/hardware.json") as f:
              cfg = json.load(f)
          rows = []
          for hw, meta in cfg["hardware"].items():
              for role in meta["roles"]:
                  rows.append({
                      "hardware":   hw,
                      "role":       role,
                      "env":        f"{hw}-{role}",
                      "chip":       meta["chip"],
                      "flash_size": meta["flash_size"],
                      "flash_mode": meta["flash_mode"],
                      "flash_freq": meta["flash_freq"],
                  })
          print("include=" + json.dumps(rows))
          PY

  build:
    needs: matrix
    name: ${{ matrix.hardware }} / ${{ matrix.role }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      - name: Build
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}

      - name: Merge factory image
        working-directory: firmware
        env:
          ARTIFACT_PREFIX: lumehead-${{ matrix.env }}
          BUILD_DIR: .pio/build/${{ matrix.env }}
        run: |
          set -euo pipefail
          mkdir -p dist

          python -m esptool --chip ${{ matrix.chip }} merge_bin \
            -o "dist/${ARTIFACT_PREFIX}-factory.bin" \
            --flash_mode ${{ matrix.flash_mode }} \
            --flash_freq ${{ matrix.flash_freq }} \
            --flash_size ${{ matrix.flash_size }} \
            0x0     "$BUILD_DIR/bootloader.bin" \
            0x8000  "$BUILD_DIR/partitions.bin" \
            0xe000  ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 "$BUILD_DIR/firmware.bin"

          # Also expose the raw artifacts for users who want to flash piecewise.
          cp "$BUILD_DIR/firmware.bin"   "dist/${ARTIFACT_PREFIX}-app.bin"
          cp "$BUILD_DIR/bootloader.bin" "dist/${ARTIFACT_PREFIX}-bootloader.bin"
          cp "$BUILD_DIR/partitions.bin" "dist/${ARTIFACT_PREFIX}-partitions.bin"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumehead-${{ matrix.env }}
          path: firmware/dist/*

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/dist/*

      - name: Attach to release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: firmware/dist/*

  # ---------------------------------------------------------------------------
  # Package the Klipper plugin as a versioned tarball + zip and attach to
  # the release. The plugin is a single Python module + README; users drop
  # `led_matrix_display.py` into `~/klipper/klippy/extras/`.
  # ---------------------------------------------------------------------------
  klipper-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag || 'dev' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage and archive plugin
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          STAGE="lumehead-klipper-${TAG}"
          mkdir -p "dist/${STAGE}"
          cp klipper/led_matrix_display.py "dist/${STAGE}/"
          cp klipper/README.md             "dist/${STAGE}/"
          cp LICENSE                       "dist/${STAGE}/" || true
          (cd dist && tar -czf "${STAGE}.tar.gz" "${STAGE}")
          (cd dist && zip -qr "${STAGE}.zip"     "${STAGE}")
          ls -l dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumehead-klipper
          path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip

      - name: Attach to release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
